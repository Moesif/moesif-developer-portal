name: Frontend CI

on:
  pull_request:
    paths:
      - "my-dev-portal/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches:
      - develop
      - staging
      - main
    paths:
      - "my-dev-portal/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: my-dev-portal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: my-dev-portal/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
